name: Update profile summary

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate profile summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_summary.py "${{ github.repository_owner }}"

      - name: Test profile summary generator
        run: python3 -m unittest discover -s tests -v

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          paths = [
              Path("profile-summary-card-output/github/0-profile-details.svg"),
              Path("profile-summary-card-output/github_dark/0-profile-details.svg"),
          ]
          for path in paths:
              content = path.read_text(encoding="utf-8")
              if "ERROR" in content or "temporarily unavailable" in content:
                  raise SystemExit(f"Refusing to publish an error card: {path}")
              root = ElementTree.fromstring(content)
              if not root.tag.endswith("svg"):
                  raise SystemExit(f"Generated file is not SVG: {path}")
          PY

      - name: Commit updated summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile summary cards"
          git push
